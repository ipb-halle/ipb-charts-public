# Default values for metfrag.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Global
FeedbackEmailTo: nobody@example.com
FeedbackEmailHost: mail.example.com

webpath: /
RESTpath: /metfragrest
NumberThreads: 2

RESTname: metfragrest

replicaCount: 1
replicaRESTCount: 1

image:
  repository: ipbhalle/metfragweb
  pullPolicy: Always

imageREST:
  repository: ipbhalle/metfragrest
  pullPolicy: Always

#storage:
#  volumes:
#    - name: spectral-databases
#      emptyDir: {}
#    - name: candidate-databases
#      emptyDir: {}


postgres:
  fullnameOverride: "metfrag-postgresql"
  auth:
    password: "secretpassword"
    database: "metchem"
  persistence:
    enabled: yes
    size: "80Gi"
  initdb:
    scriptsConfigMap: configmapscripts
  # Increase startup probe timeout for large database initialization (80GB download and load)
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 180  # 30 minutes: 30s initial + (180 * 10s) = 1830s total
    successThreshold: 1
  initContainers:
    - name: install-wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Copying wget for database initialization..."
          # busybox wget is statically linked, so it has no library dependencies
          cp /bin/wget /shared-bin/wget
          chmod +x /shared-bin/wget
          echo "wget copied to shared location"
          /shared-bin/wget --version || echo "wget verification failed"
      volumeMounts:
        - name: shared-bin
          mountPath: /shared-bin
      securityContext:
        runAsUser: 0
        runAsGroup: 0
  extraVolumes:
    - name: shared-bin
      emptyDir: {}
  extraVolumeMounts:
    - name: shared-bin
      mountPath: /shared-bin

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

nameRESTOverride: ""
fullnameRESTOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:

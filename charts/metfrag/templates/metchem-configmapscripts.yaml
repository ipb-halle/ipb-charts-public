apiVersion: v1
kind: ConfigMap
metadata:
  name: configmapscripts
data:
  01-init-metchem.sh: |
    #!/bin/bash
    set -e
    
    echo "Starting metchem database initialization..."
    
    # Check if SQL dumps are available
    if [ ! -f /sql-dumps/prep-metchem-2016.sql.gz ] || [ ! -f /sql-dumps/metchem-2016.sql.gz ]; then
        echo "ERROR: SQL dump files not found in /sql-dumps/"
        exit 1
    fi
    
    # Load prep-metchem SQL dump into postgres database
    echo "Loading prep-metchem data into postgres database..."
    zcat /sql-dumps/prep-metchem-2016.sql.gz | PGPASSWORD="${POSTGRES_PASSWORD}" psql -U postgres
    
    # Load metchem SQL dump into metchem database
    echo "Loading metchem data into metchem database..."
    zcat /sql-dumps/metchem-2016.sql.gz | PGPASSWORD="${POSTGRES_PASSWORD}" psql -U postgres -d metchem
    
    echo "Database initialization completed successfully."

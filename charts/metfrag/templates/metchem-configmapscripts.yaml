apiVersion: v1
kind: ConfigMap
metadata:
  name: configmapscripts
data:
  01-init-metchem.sh: |
    #!/bin/bash
    set -e
    
    echo "Starting metchem database initialization..."
    
    # Install wget if not available
    if ! command -v wget &> /dev/null; then
        echo "Installing wget..."
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq 2>&1 | grep -v '^W:' || true
        apt-get install -y -qq wget 2>&1 | grep -v '^debconf:' || true
    fi
    
    # Download and load prep-metchem SQL dump into postgres database
    echo "Loading prep-metchem data into postgres database..."
    wget -q -O - https://msbi.ipb-halle.de/~sneumann/prep-metchem-2016.sql.gz | zcat | PGPASSWORD="${POSTGRES_PASSWORD}" psql -U postgres
    
    # Download and load metchem SQL dump into metchem database
    echo "Loading metchem data into metchem database..."
    wget -q -O - https://msbi.ipb-halle.de/~sneumann/metchem-2016.sql.gz | zcat | PGPASSWORD="${POSTGRES_PASSWORD}" psql -U postgres -d metchem
    
    echo "Database initialization completed successfully."
